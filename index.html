<!-- An app by Evan Lopez -->
<!DOCTYPE html>
<html lang = "en-US">
    <head>
        <meta charset="UTF-8">
        <link rel = "stylesheet" href = "Stylesheets/style.css">
        <link rel = "stylesheet" href = "Stylesheets/list.css">
        <link rel = "stylesheet" href = "Stylesheets/task.css">
        <link rel = stylesheet href = "Stylesheets/doubleCheckPopUp.css">
        <script type="module" src = "JS/main.js" defer></script>
    </head>

    <body>

        <button class = "addList" id = "button">Add New List</button>
        <button id = "deleteAllLists">Delete All Lists</button>

        <div class="editPopUp-container">
            <div id="popup" class="editPopUp">
                    <div class="editPopUp-content">
                        <label for="taskNameChange">
                            <input type="text" id = "taskNameInputField" class="taskNameChange" maxlength="100">
                        </label>
                        <button class = "taskNameButton">Change Task Name</button>
                        <button class = "editTaskCancelButton">Cancel</button>
                    </div>
            </div>
        </div> 
        
        <div class = "doubleCheckPopUp">

            <div id = "subDCPContainer">

                <div class = "doubleCheckPopUpBox">
                        <p id = "DCPUPara">Are you sure you want to delete all lists?</p> 
                        <button class = "doubleCheckPopUpButton" id = "DCPUYes">Yes</button>
                        <button class = "doubleCheckPopUpButton" id = "DCPUNo">No</button>
                </div>

            </div>
            
        </div>

        <div class = "mainContainer">
            
            

            <div class = "list" id = "L2">

                <div class = "listButtons">
                    <button class = "add">Add Task</button>
                    <button class = "delList">Delete List</button>
                </div>

                <div class = "task">
                    <p class = "taskName">My Task</p>
                    <button class = "del">Delete</button>
                    <button class = "edit">Edit</button>
                    <input type = "checkbox">
                </div>

                <div class = "task">
                    <p class = "taskName">My Task #2</p>
                    <button class = "del">Delete</button>
                    <button class = "edit">Edit</button>
                    <input type = "checkbox">
                </div>

                <div class = "task">
                    <p class = "taskName">My Task #3</p>
                    <button class = "del">Delete</button>
                    <button class = "edit">Edit</button>
                    <input type = "checkbox">
                </div>
            </div>

        </div>

      

    </body>
</html>
